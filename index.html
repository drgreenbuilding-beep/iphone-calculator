<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>計算機 · iPhone</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff,#f4f1ec 42%,#d8d3cc)}.phone{width:min(394px,94vw);aspect-ratio:9/19.3;max-height:95vh;border:9px solid #202024;border-radius:51px;background:#08080a;overflow:hidden;position:relative;box-shadow:0 30px 70px #19161252}.phone:before{content:"";position:absolute;z-index:2;top:10px;left:50%;transform:translateX(-50%);width:108px;height:28px;border-radius:20px;background:#000}.screen{height:100%;padding:17px 13px 14px;display:flex;flex-direction:column;background:linear-gradient(155deg,#161618,#09090a 47%,#121214)}.status{height:31px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:650}.status-right{display:flex;gap:7px;align-items:center;font-size:11px}.battery{width:22px;height:11px;border:1px solid #fff;border-radius:3px;padding:1px}.battery i{display:block;width:75%;height:100%;background:#fff}.display{flex:1;min-height:158px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:0 11px 16px;overflow:hidden}.process{max-height:70px;overflow:auto;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}.process-row{color:#85858b;font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.process-row strong{color:#b5b5ba;font-weight:500}.expression{color:#99999f;font-size:16px;min-height:21px;white-space:nowrap;overflow:auto;text-align:right;scrollbar-width:none}.value{color:#f5f5f7;font-size:84px;line-height:.93;font-weight:270;letter-spacing:-3px;white-space:nowrap;width:100%;min-width:0;overflow:auto;text-align:right;scrollbar-width:none}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:0 2px 10px}button{border:0;font:inherit;cursor:pointer;aspect-ratio:1;border-radius:50%;color:#fff;background:#333336;font-size:29px;font-weight:450}button:active{transform:scale(.93);filter:brightness(1.25)}button.utility{background:#a5a5a7;color:#060607;font-size:25px}button.operator{background:#ff9f0a;font-size:35px}button.operator.active{color:#ff9f0a;background:#fff}button.zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;text-align:left;padding-left:29px}.footnote{text-align:center;color:#77777d;font-size:10px;letter-spacing:1px;margin-top:4px}.home{width:115px;height:4px;border-radius:10px;background:#fff;margin:5px auto 2px}@media(max-height:700px){.phone{max-height:98vh}.display{min-height:122px}.keys{gap:7px}}</style></head><body><main class="phone" aria-label="iPhone 風格計算機"><div class="screen"><header class="status"><span id="clock">9:41</span><span class="status-right">▮▮▮ ⌁ <span class="battery"><i></i></span></span></header><div class="display"><div class="process" id="process" aria-label="計算過程"></div><div class="expression" id="expression"></div><div class="value" id="display">0</div></div><div class="keys"><button class="utility" data-a="clear">AC</button><button class="utility" data-a="sign">±</button><button class="utility" data-a="percent">%</button><button class="operator" data-o="÷">÷</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="operator" data-o="×">×</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button class="operator" data-o="−">−</button><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button class="operator" data-o="+">+</button><button class="zero" data-n="0">0</button><button data-a="decimal">.</button><button class="operator" data-a="equals">=</button></div><div class="footnote">LOCAL • CALCULATOR</div><div class="home"></div></div></main><script>const d=document.querySelector('#display'),e=document.querySelector('#expression'),p=document.querySelector('#process'),ops=[...document.querySelectorAll('[data-o]')];let c='0',pr=null,op=null,wait=false,done=false,h=[];function group(s){let out='';for(let i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)out+=',';out+=s[i]}return out}function clean(n){if(!Number.isFinite(n))return'Error';return Math.abs(n)>=1e10?String(n):String(Math.round(n*1e10)/1e10)}function fmt(n){let s=typeof n==='number'?clean(n):String(n);if(s==='Error')return s;let a=s.split('.'),w=a[0],sg=w[0]==='-'?'-':'',g=group(sg?w.slice(1):w);return sg+g+(a[1]!==undefined?'.'+a[1]:'')}function render(){d.textContent=fmt(c);let l=d.textContent.length;d.style.fontSize=Math.max(24,Math.min(84,Math.floor(330/Math.max(1,l*.58))))+'px';d.style.letterSpacing=l>16?'-1px':'-3px';e.textContent=pr!==null&&op?fmt(pr)+' '+op:'';p.innerHTML=h.map(x=>'<div class="process-row"><strong>'+x.l+' '+x.o+' '+x.r+'</strong> = '+x.v+'</div>').join('');requestAnimationFrame(()=>{d.scrollLeft=d.scrollWidth;e.scrollLeft=e.scrollWidth;p.scrollTop=p.scrollHeight});ops.forEach(x=>x.classList.toggle('active',x.dataset.o===op&&wait))}function add(l,o,r,v){h.push({l:fmt(l),o:o,r:fmt(r),v:fmt(v)});if(h.length>4)h.shift()}function num(n){if(c==='Error'||wait||done){c=n;wait=false;done=false}else c=c==='0'?n:c+n;render()}function calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b}function choose(o){let v=Number(c);if(pr!==null&&op&&!wait){let r=calc(pr,v,op);add(pr,op,v,r);pr=r;c=clean(r)}else pr=v;op=o;wait=true;done=false;render()}function equals(){if(pr===null||!op)return;let a=pr,b=Number(c),r=calc(a,b,op);add(a,op,b,r);c=clean(r);pr=null;op=null;wait=false;done=true;render()}function clear(){c='0';pr=null;op=null;wait=false;done=false;h=[];render()}function sign(){if(c!=='0'&&c!=='Error')c=c[0]==='-'?c.slice(1):'-'+c;render()}function percent(){if(c!=='Error')c=fmt(Number(c)/100);render()}function decima
