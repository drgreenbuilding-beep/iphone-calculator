<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090a"><title>工程用計算機</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e6e1}.stage{width:100%;min-height:100vh;display:grid;place-items:center;padding:16px}.phone{width:min(420px,96vw);height:min(900px,96vh);border:9px solid #202024;border-radius:51px;background:#08080a;overflow:hidden;box-shadow:0 30px 70px #19161652;position:relative}.phone:before{content:"";position:absolute;z-index:3;top:10px;left:50%;transform:translateX(-50%);width:108px;height:28px;border-radius:20px;background:#000}.screen{height:100%;padding:16px 12px 12px;display:flex;flex-direction:column;background:linear-gradient(155deg,#161618,#09090a 47%,#121214)}.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:650}.display{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 10px 10px;gap:6px;overflow:hidden}.process{max-height:70px;overflow:auto;display:flex;flex-direction:column;gap:3px}.process-row{color:#85858b;font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.process-row strong{color:#b8b8bd;font-weight:500}.expression{color:#929298;font-size:15px;min-height:20px;white-space:nowrap;overflow:auto;text-align:right}.value{color:#f5f5f7;font-size:84px;line-height:.9;font-weight:270;letter-spacing:-3px;white-space:nowrap;width:100%;overflow:hidden;text-align:right}.mode{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-height:25px;color:#8d8d93;font-size:12px}.mode button{aspect-ratio:auto;border:0;border-radius:10px;padding:4px 9px;font-size:12px;background:#333336;color:#fff}.mode button.on{background:#ff9f0a}.scientific,.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 2px 8px}.keys{grid-template-columns:repeat(4,1fr);gap:10px}.scientific button{border:0;border-radius:14px;aspect-ratio:1;background:#252529;color:#e6e6e8;font-size:15px}.keys button{border:0;font:inherit;cursor:pointer;aspect-ratio:1;border-radius:50%;color:#fff;background:#333336;font-size:22px;display:grid;place-items:center}.keys button:active,.scientific button:active{transform:scale(.93)}.keys .utility{background:#a5a5a7;color:#060607}.keys .operator{background:#ff9f0a;font-size:30px}.keys .zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;justify-content:flex-start;padding-left:25px}.home{width:115px;height:4px;border-radius:10px;background:#fff;opacity:.88;margin:5px auto 1px}.footnote{text-align:center;color:#77777d;font-size:9px;letter-spacing:1px}@media(max-height:700px){.phone{height:98vh}.display{min-height:105px}.scientific,.keys{gap:5px}.scientific button{font-size:13px}.keys button{font-size:18px}}</style><style>body{overflow:hidden}.stage{height:100vh;min-height:0;padding:8px}.phone{height:min(900px,calc(100vh - 16px));max-height:calc(100vh - 16px)}@media(max-height:760px){.phone{height:calc(100vh - 10px);max-height:calc(100vh - 10px)}.screen{padding-top:10px;padding-bottom:7px}.status{height:22px}.display{min-height:84px;padding-bottom:5px;gap:3px}.process{max-height:38px}.mode{min-height:21px}.scientific,.keys{gap:4px;padding-bottom:4px}.scientific button{font-size:12px}.keys{gap:5px}.keys button{font-size:18px}.keys .operator{font-size:23px}.home{margin-top:2px}.footnote{display:none}}</style></head><body><main class="stage"><section class="phone"><div class="screen"><div class="status"><span id="clock">10:45</span><span>▮▮▮ ▣</span></div><div class="display"><div id="process" class="process"></div><div id="expression" class="expression">工程模式 · DEG</div><div id="value" class="value">0</div></div><div class="mode"><span id="modeLabel">角度：DEG</span><button id="modeBtn" class="on">DEG</button><button id="clearHistory">清除過程</button></div><div class="scientific"><button data-u="sin">sin</button><button data-u="cos">cos</button><button data-u="tan">tan</button><button data-u="asin">sin⁻¹</button><button data-u="acos">cos⁻¹</button><button data-u="atan">tan⁻¹</button><button data-u="ln">ln</button><button data-u="log">log</button><button data-u="sqrt">√</button><button data-u="square">x²</button><button data-u="power">xʸ</button><button data-u="inverse">1/x</button><button data-u="factorial">x!</button><button data-u="pi">π</button><button data-u="e">e</button></div><div class="keys"><button class="utility" data-a="clear">AC</button><button class="utility" data-a="sign">±</button><button class="utility" data-a="percent">%</button><button class="operator" data-o="÷">÷</button><button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button class="operator" data-o="×">×</button><button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button class="operator" data-o="−">−</button><button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button class="operator" data-o="+">+</button><button class="zero" data-d="0">0</button><button data-a="decimal">.</button><button class="operator" data-a="equals">=</button></div><div class="home"></div><div class="footnote">ENGINEERING CALCULATOR</div></div></section></main><script>const value=document.querySelector('#value'),expression=document.querySelector('#expression'),processBox=document.querySelector('#process'),modeBtn=document.querySelector('#modeBtn'),modeLabel=document.querySelector('#modeLabel');let current='0',previous=null,operator=null,waiting=false,justEvaluated=false,angle='DEG',history=[];const clean=n=>{if(!Number.isFinite(n))return'Error';if(Math.abs(n)>=1e12||(Math.abs(n)>0&&Math.abs(n)<1e-7))return n.toExponential(8);return String(Math.round(n*1e12)/1e12)};function group(s){let p=s,sign='';if(p[0]==='-'){sign='-';p=p.slice(1)}let ex='',at=p.indexOf('e');if(at<0)at=p.indexOf('E');if(at>=0){ex=p.slice(at);p=p.slice(0,at)}let a=p.split('.'),out='',c=0;for(let i=a[0].length-1;i>=0;i--){out=a[0][i]+out;c++;if(c===3&&i>0){out=','+out;c=0}}return sign+out+(a[1]!==undefined?'.'+a[1]:'')+ex}function render(){value.textContent=group(current);value.style.fontSize=Math.max(25,Math.min(84,Math.floor(350/(Math.max(1,value.textContent.length)*.58))))+'px';expression.textContent=operator&&previous!==null?group(clean(previous))+' '+operator:(angle==='DEG'?'工程模式 · DEG':'工程模式 · RAD');processBox.innerHTML=history.slice(-4).map(x=>'<div class="process-row">'+x+'</div>').join('');modeLabel.textContent='角度：'+angle;modeBtn.textContent=angle;modeBtn.classList.toggle('on',angle==='DEG')}function num(){return Number(current)}function inputDigit(d){if(waiting||justEvaluated){current=d;waiting=false;justEvaluated=false}else current=current==='0'?d:current+d;render()}function decimal(){if(waiting||justEvaluated){current='0';waiting=false;justEvaluated=false}if(!current.includes('.'))current+='.';render()}function chooseOp(op){if(operator&&!waiting)equals(false);previous=num();operator=op;waiting=true;justEvaluated=false;render()}function calculate(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;if(op==='xʸ')return Math.pow(a,b);return NaN}function equals(add=true){if(operator===null||previous===null)return;let a=previous,b=num(),r=calculate(a,b,operator);current=clean(r);if(add)history.push(group(clean(a))+' '+operator+' '+group(clean(b))+' = <strong>'+group(current)+'</strong>');previous=null;operator=null;waiting=true;justEvaluated=true;render()}function unary(kind){let n=num(),r=n,rad=angle==='DEG'?n*Math.PI/180:n;if(kind==='sin')r=Math.sin(rad);if(kind==='cos')r=Math.cos(rad);if(kind==='tan')r=Math.tan(rad);if(kind==='asin')r=angle==='DEG'?Math.asin(n)*180/Math.PI:Math.asin(n);if(kind==='acos')r=angle==='DEG'?Math.acos(n)*180/Math.PI:Math.acos(n);if(kind==='atan')r=angle==='DEG'?Math.atan(n)*180/Math.PI:Math.atan(n);if(kind==='ln')r=Math.log(n);if(kind==='log')r=Math.log10(n);if(kind==='sqrt')r=Math.sqrt(n);if(kind==='square')r=n*n;if(kind==='inverse')r=1/n;if(kind==='factorial'){r=1;for(let i=2;i<=n&&i<=170;i++)r*=i;if(n<0||n%1!==0||n>170)r=NaN}if(kind==='pi')r=Math.PI;if(kind==='e')r=Math.E;current=Number.isFinite(r)?clean(r):'Error';history.push(kind+'('+group(clean(n))+') = <strong>'+group(current)+'</strong>');waiting=true;justEvaluated=true;render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>inputDigit(b.dataset.d));document.querySelector('[data-a="decimal"]').onclick=decimal;document.querySelector('[data-a="clear"]').onclick=()=>{current='0';previous=null;operator=null;waiting=false;justEvaluated=false;render()};document.querySelector('[data-a="sign"]').onclick=()=>{if(current!=='0')current=current[0]==='-'?current.slice(1):'-'+current;render()};document.querySelector('[data-a="percent"]').onclick=()=>{current=clean(num()/100);render()};document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>chooseOp(b.dataset.o));document.querySelector('[data-a="equals"]').onclick=()=>equals(true);document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{if(b.dataset.u==='power'){chooseOp('xʸ');return}unary(b.dataset.u)});modeBtn.onclick=()=>{angle=angle==='DEG'?'RAD':'DEG';render()};document.querySelector('#clearHistory').onclick=()=>{history=[];render()};document.addEventListener('keydown',e=>{let k=e.key;if(k>='0'&&k<='9')inputDigit(k);else if(k==='.')decimal();else if(k==='Enter'||k==='=')equals(true);else if(k==='Escape')document.querySelector('[data-a="clear"]').click();else if(k==='+'||k==='- '||k==='-')chooseOp(k==='+'?'+':'−');else if(k==='*')chooseOp('×');else if(k==='/')chooseOp('÷')});render();</script></body></html>
